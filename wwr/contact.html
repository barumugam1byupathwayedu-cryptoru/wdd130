<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Discover River Rush Rafting, our history, mission, and passion for unforgettable whitewater adventures.">
    <meta name="author" content="Bridgette Arumugam">

    <title>About Us | River Rush Rafting</title>

    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <a class="logo" href="index.html"></a>
        <img
          src="https://byui-cse.github.io/wdd130-ww-course/resources/images/logos/z-raftingbw.png"
          alt="Rafting logo" width="150">

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a><br>
            <a href="about.html">About Us</a><br>
            <a href="trips.html">Trips</a><br>
            <a href="contact.html">Contact Us</a><br>

        </nav>
    </header>

    <main class="contact-page">
        <h1>White Water Rafting Company</h1>

        <section class="company-info">
            <h2>White Water Rafting Company</h2>
            <address>
                <strong>123 Main River Street</strong><br>
                <strong>Kolob, California</strong><br>
                <strong>+1 999 999 9999</strong><br>
                <strong>info@whitewater.com</strong>
            </address>
        </section>

        <section class="contact-layout">
            <div class="contact-map">
                <iframe
                  src="https://maps.google.com/maps?q=Kolob%20California&t=&z=13&ie=UTF8&iwloc=&output=embed"
                  title="Map showing our rafting company location" width="100%" height="247"
                  loading="lazy" allowfullscreen>
                </iframe>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-row">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Placeholder"
                      required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <fieldset class="purpose-field">
                    <legend>Message<br>Purpose</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="message-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"
                      required></textarea>
                </div>

                <div class="newsletter-field">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-list">
                <figure>
                    <img src="images/employee1.jpg"
                      alt="Portrait of the rafting operations manager">
                    <figcaption>
                        <strong>Employee Profile</strong>
                        <span>Operations Manager</span>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Portrait of the rafting guide">
                    <figcaption>
                        <strong>Employee Profile</strong>
                        <span>Rafting Guide</span>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Portrait of the customer service employee">
                    <figcaption>
                        <strong>Employee Profile</strong>
                        <span>Customer Service</span>
                    </figcaption>
                </figure>
            </div>
        </section>
        <footer>
            <p>
                © 2026 🌊 River Rush Rafting 🌊 Bridgette Sarah Arumugam
            </p>

            <nav class="socialmedia">
                <a href="https://www.facebook.com/" target="_blank" rel="noopener">
                    <img src="images/facebook.png" alt="Visit our Facebook page" width="" 100>
                </a>

                <a href="https://www.instagram.com/" target="_blank" rel="noopener">
                    <img src="images/instagram.png" alt="Visit our Instagram page" w>
                </a>

                <a href="https://www.linkedin.com/" target="_blank" rel="noopener">
                    <img src="images/linkedin.png" alt="Visit our linkedin page">
                </a>
            </nav>
        </footer>
    </main>
